<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 32px; fill: #FFFFFF; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 15px; fill: #94A3B8; }
      .th { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; }
      .layer-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 12px; }
      .tech-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13.5px; fill: #F8FAFC; }
      .tech-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #CBD5E1; line-height: 1.4; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="180" x2="1600" y2="180" />
    <line x1="0" y1="360" x2="1600" y2="360" />
    <line x1="0" y1="540" x2="1600" y2="540" />
    <line x1="0" y1="720" x2="1600" y2="720" />
  </g>

  <!-- Header Area -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="138" height="26" rx="13" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" />
    <text x="69" y="17" text-anchor="middle" class="badge-text" fill="#34D399">STACK MATRIX</text>

    <text x="0" y="60" class="title">ReLoop <tspan fill="#34D399">Technology Architecture Matrix</tspan></text>
    <text x="0" y="84" class="subtitle">Full-stack enterprise specifications across AI, Frontend, Cloud Runtime, Storage, and Automated Reliability</text>

    <!-- Top stats -->
    <g transform="translate(1080, 20)">
      <rect x="0" y="0" width="380" height="48" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="29" class="tech-sub"><tspan fill="#F8FAFC" font-weight="700">Cloud Run:</tspan> Mumbai (asia-south1)</text>
      <line x1="210" y1="14" x2="210" y2="34" stroke="#334155" />
      <text x="225" y="29" class="tech-sub"><tspan fill="#34D399" font-weight="700">76 / 76</tspan> Automated Tests Passing</text>
    </g>
  </g>

  <!-- Table Headers -->
  <g transform="translate(60, 168)">
    <rect x="0" y="0" width="1480" height="38" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="24" y="24" class="th">Architectural Layer</text>
    <text x="280" y="24" class="th">Core Technologies &amp; Versions</text>
    <text x="660" y="24" class="th">Specific Role in ReLoop Solution</text>
    <text x="1100" y="24" class="th">Key Technical Advantage</text>
  </g>

  <!-- ROW 1: AI & Multimodal Intelligence -->
  <g transform="translate(60, 218)">
    <rect x="0" y="0" width="1480" height="114" rx="10" fill="#091E1A" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="#10B981" />
    
    <!-- Col 1: Layer -->
    <text x="24" y="42" class="layer-title" fill="#34D399">AI &amp; Vision Intelligence</text>
    <text x="24" y="64" class="layer-sub" fill="#6EE7B7">Multimodal Assessment</text>
    <rect x="24" y="76" width="95" height="22" rx="4" fill="#10B981" fill-opacity="0.15" />
    <text x="71" y="91" text-anchor="middle" class="badge-text" fill="#34D399">Vertex AI</text>

    <!-- Col 2: Technologies -->
    <text x="280" y="38" class="tech-main">• Gemini 2.5 Flash <tspan class="tech-sub">(gemini-2.5-flash)</tspan></text>
    <text x="280" y="62" class="tech-main">• Google Cloud Vertex AI <tspan class="tech-sub">(us-central1)</tspan></text>
    <text x="280" y="86" class="tech-main">• @google/genai SDK <tspan class="tech-sub">(v2.28) + Zod 4.6</tspan></text>

    <!-- Col 3: Role in ReLoop -->
    <text x="660" y="38" class="desc-text">• Sub-second visual item recognition from photos &amp; text descriptions.</text>
    <text x="660" y="62" class="desc-text">• Dynamic 2–4 targeted condition-clarifying questions (wobble, stains).</text>
    <text x="660" y="86" class="desc-text">• Evaluates circular hierarchy: Repair &gt; Reuse &gt; Donate &gt; DWCC.</text>

    <!-- Col 4: Key Advantage -->
    <text x="1100" y="38" class="desc-text">• <tspan fill="#34D399" font-weight="700">Zero Hallucination:</tspan> Strict Zod JSON schema validation.</text>
    <text x="1100" y="62" class="desc-text">• Enterprise SLA &amp; dedicated quota on Google Cloud Vertex AI.</text>
    <text x="1100" y="86" class="desc-text">• Multimodal token optimization with sub-second response time.</text>
  </g>

  <!-- ROW 2: Frontend & Interactive UX -->
  <g transform="translate(60, 344)">
    <rect x="0" y="0" width="1480" height="114" rx="10" fill="#0C1A30" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="#3B82F6" />
    
    <!-- Col 1: Layer -->
    <text x="24" y="42" class="layer-title" fill="#60A5FA">Frontend &amp; UX Engine</text>
    <text x="24" y="64" class="layer-sub" fill="#93C5FD">Reactive &amp; Mobile-First</text>
    <rect x="24" y="76" width="112" height="22" rx="4" fill="#3B82F6" fill-opacity="0.15" />
    <text x="80" y="91" text-anchor="middle" class="badge-text" fill="#60A5FA">Next.js App Router</text>

    <!-- Col 2: Technologies -->
    <text x="280" y="38" class="tech-main">• Next.js 15.1 <tspan class="tech-sub">(App Router &amp; SSR)</tspan></text>
    <text x="280" y="62" class="tech-main">• React 19 &amp; React-DOM 19</text>
    <text x="280" y="86" class="tech-main">• TypeScript 5.7 + Tailwind CSS 3.4</text>

    <!-- Col 3: Role in ReLoop -->
    <text x="660" y="38" class="desc-text">• Server-rendered responsive application optimized for mobile web.</text>
    <text x="660" y="62" class="desc-text">• Optimistic UI updates for immediate image preview and question transitions.</text>
    <text x="660" y="86" class="desc-text">• Accessible design: Lucide icons, reduced motion toggles &amp; dark/light mode.</text>

    <!-- Col 4: Key Advantage -->
    <text x="1100" y="38" class="desc-text">• Zero-bundle bloat: Server components reduce client JavaScript.</text>
    <text x="1100" y="62" class="desc-text">• 100% Type-Safe: End-to-end typing eliminates runtime UI crashes.</text>
    <text x="1100" y="86" class="desc-text">• Fluid, native-feeling performance across all smartphone viewports.</text>
  </g>

  <!-- ROW 3: Serverless Cloud Runtime & DevOps -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="1480" height="114" rx="10" fill="#180F2A" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="#A855F7" />
    
    <!-- Col 1: Layer -->
    <text x="24" y="42" class="layer-title" fill="#C084FC">Serverless Cloud Runtime</text>
    <text x="24" y="64" class="layer-sub" fill="#D8B4FE">DevOps &amp; Security</text>
    <rect x="24" y="76" width="102" height="22" rx="4" fill="#A855F7" fill-opacity="0.15" />
    <text x="75" y="91" text-anchor="middle" class="badge-text" fill="#C084FC">Google Cloud Run</text>

    <!-- Col 2: Technologies -->
    <text x="280" y="38" class="tech-main">• Google Cloud Run <tspan class="tech-sub">(asia-south1, Mumbai)</tspan></text>
    <text x="280" y="62" class="tech-main">• Docker Alpine <tspan class="tech-sub">(Multi-Stage Image)</tspan></text>
    <text x="280" y="86" class="tech-main">• Google Cloud Build &amp; Keyless IAM</text>

    <!-- Col 3: Role in ReLoop -->
    <text x="660" y="38" class="desc-text">• Fully managed container hosting deployed in Mumbai for low Indian latency.</text>
    <text x="660" y="62" class="desc-text">• Automated CI/CD container build and zero-downtime deployment.</text>
    <text x="660" y="86" class="desc-text">• Least-privilege IAM service account (`reloop-cloudrun-sa`) via ADC.</text>

    <!-- Col 4: Key Advantage -->
    <text x="1100" y="38" class="desc-text">• <tspan fill="#C084FC" font-weight="700">Zero Idle Cost:</tspan> Auto-scales from 0 to peak concurrency instantly.</text>
    <text x="1100" y="62" class="desc-text">• <tspan fill="#C084FC" font-weight="700">Zero Leaked Keys:</tspan> Keyless Application Default Credentials.</text>
    <text x="1100" y="86" class="desc-text">• Compact &lt;180MB hardened container running as unprivileged user.</text>
  </g>

  <!-- ROW 4: Real-time Data & Storage -->
  <g transform="translate(60, 596)">
    <rect x="0" y="0" width="1480" height="114" rx="10" fill="#241407" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="#F59E0B" />
    
    <!-- Col 1: Layer -->
    <text x="24" y="42" class="layer-title" fill="#FBBF24">Real-time Data &amp; Storage</text>
    <text x="24" y="64" class="layer-sub" fill="#FDE68A">State &amp; Object Media</text>
    <rect x="24" y="76" width="105" height="22" rx="4" fill="#F59E0B" fill-opacity="0.15" />
    <text x="76" y="91" text-anchor="middle" class="badge-text" fill="#FBBF24">Cloud Firestore</text>

    <!-- Col 2: Technologies -->
    <text x="280" y="38" class="tech-main">• Google Cloud Firestore <tspan class="tech-sub">(NoSQL)</tspan></text>
    <text x="280" y="62" class="tech-main">• Google Cloud Storage <tspan class="tech-sub">(GCS Bucket)</tspan></text>
    <text x="280" y="86" class="tech-main">• Pub/Sub &amp; BigQuery <tspan class="tech-sub">(Analytics Bus)</tspan></text>

    <!-- Col 3: Role in ReLoop -->
    <text x="660" y="38" class="desc-text">• Manages real-time item listings, reservations, and 2-party verified handovers.</text>
    <text x="660" y="62" class="desc-text">• Powers the Community Grove ledger (1 handover = 1 tree, 10 = milestone).</text>
    <text x="660" y="86" class="desc-text">• Secure object bucket storage for verified item photographs.</text>

    <!-- Col 4: Key Advantage -->
    <text x="1100" y="38" class="desc-text">• Instant live synchronization via reactive snapshot listeners.</text>
    <text x="1100" y="62" class="desc-text">• Server-side deduplication guarantees community impact integrity.</text>
    <text x="1100" y="86" class="desc-text">• Enterprise readiness for municipal BBMP circular data warehousing.</text>
  </g>

  <!-- ROW 5: Reliability, Spatial & QA -->
  <g transform="translate(60, 722)">
    <rect x="0" y="0" width="1480" height="114" rx="10" fill="#061D1A" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="#14B8A6" />
    
    <!-- Col 1: Layer -->
    <text x="24" y="42" class="layer-title" fill="#2DD4BF">Spatial, Reliability &amp; QA</text>
    <text x="24" y="64" class="layer-sub" fill="#99F6E4">Testing &amp; Fail-Safe</text>
    <rect x="24" y="76" width="108" height="22" rx="4" fill="#14B8A6" fill-opacity="0.15" />
    <text x="78" y="91" text-anchor="middle" class="badge-text" fill="#2DD4BF">Vitest &amp; Fallback</text>

    <!-- Col 2: Technologies -->
    <text x="280" y="38" class="tech-main">• Haversine Spatial Geofence <tspan class="tech-sub">(2–20km)</tspan></text>
    <text x="280" y="62" class="tech-main">• Vitest 5.0 <tspan class="tech-sub">(13 Test Suites)</tspan></text>
    <text x="280" y="86" class="tech-main">• Puppeteer Core + Deterministic Engine</text>

    <!-- Col 3: Role in ReLoop -->
    <text x="660" y="38" class="desc-text">• Proximity filtering for zero-courier walking handoffs across Bengaluru.</text>
    <text x="660" y="62" class="desc-text">• Deterministic rule fallback automatically kicks in if AI quota/network fails.</text>
    <text x="660" y="86" class="desc-text">• Automated browser verification of end-to-end user journeys &amp; Grove flows.</text>

    <!-- Col 4: Key Advantage -->
    <text x="1100" y="38" class="desc-text">• <tspan fill="#2DD4BF" font-weight="700">100% System Uptime:</tspan> Users are never blocked by API drops.</text>
    <text x="1100" y="62" class="desc-text">• <tspan fill="#2DD4BF" font-weight="700">76 / 76 Tests Passing:</tspan> Rigorous test coverage across all features.</text>
    <text x="1100" y="86" class="desc-text">• Ultra-fast spatial math without heavy external map licensing costs.</text>
  </g>

  <!-- Bottom Footer -->
  <g transform="translate(60, 856)">
    <text x="0" y="16" class="subtitle" fill="#64748B">Live Production Deployment: <tspan fill="#94A3B8">https://reloop-app-882475917539.asia-south1.run.app</tspan></text>
    <text x="1480" y="16" text-anchor="end" class="subtitle" fill="#10B981">Zero Greenwashing • 100% Cloud-Native • Keyless ADC</text>
  </g>
</svg>
